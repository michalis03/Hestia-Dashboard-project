name: Validate Hestia
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit
      - run: npm run build
      - run: |
          node --check dist/hestia-community.js
          node -e 'const f = require("./hacs.json").filename; if (!require("node:fs").statSync("dist/" + f).size) process.exit(1)'
